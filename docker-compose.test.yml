services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-test_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_pass}
      POSTGRES_DB: ${POSTGRES_DB:-test_db}
    ports:
      - "5433:5432" # Используем другой порт, чтобы не конфликтовать
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-test_user} -d ${POSTGRES_DB:-test_db}"]
      interval: 2s
      timeout: 5s
      retries: 10
      