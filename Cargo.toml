[package]
name = "axum_postgres_app"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]
resolver = "2"

[dependencies]
# Веб-фреймворк
axum = "0.8.9"

# Асинхронный рантайм
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }

# Работа с БД (компиляция запросов, пул соединений)
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "time", "migrate"] }

# Сериализация/десериализация JSON
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Чтение .env файла
dotenvy = "0.15.7"

# Логирование
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Middleware
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }

# Генерация UUID
uuid = { version = "1.27.0", features = ["serde", "v4"] }

# ORM
sea-orm = { version = "2.0.4", features = [
    "sqlx-postgres", # Драйвер для PostgreSQL
    "runtime-tokio-rustls", # Асинхронный рантайм
    "macros", # Для макроса DeriveEntityModel
    "with-chrono",
] }
sea-orm-migration = { version = "2.0.4", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
chrono = { version = "0.4", features = ["serde"] }

migration = { path = "migration" }
http-body-util = "0.1.5"

# Мониторинг
axum-prometheus = "0.10.1"
metrics-exporter-prometheus = "0.18"

[dev-dependencies]
once_cell = "1"
