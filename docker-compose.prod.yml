services:
  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE не задан в окружении}
    env_file: .env
    restart: unless-stopped
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s